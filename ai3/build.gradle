plugins {
    id 'com.android.application'
}

android {
    namespace 'com.joohkim.ai3hudtest'
    compileSdk 36

    defaultConfig {
        applicationId 'com.joohkim.ai3hudtest'
        minSdk 26
        targetSdk 28
        versionCode 2
        versionName '0.2-ai3'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
