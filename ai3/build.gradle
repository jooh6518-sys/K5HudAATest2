plugins { id 'com.android.application' }

android {
    namespace 'com.joohkim.ai3hudtest'
    compileSdk 36

    signingConfigs {
        ai3test {
            storeFile file('test-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.joohkim.ai3hudtest'
        minSdk 23
        targetSdk 28
        versionCode 100
        versionName '1.00'
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.ai3test
        }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
