plugins { id 'com.android.application' }
android {
  namespace 'kr.k5.hudprobe'
  compileSdk 35
  defaultConfig {
    applicationId 'kr.k5.hudprobe'
    minSdk 19
    targetSdk 19
    versionCode 2
    versionName '1.1'
  }
  // Head unit runs Android 4.4.2; this private APK is not distributed on Google Play.
  lint { disable 'ExpiredTargetSdkVersion' }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}
