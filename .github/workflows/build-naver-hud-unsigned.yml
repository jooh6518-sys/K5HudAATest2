name: Build Naver HUD Unsigned APK
on:
  push:
    branches:
      - naver-hud-stable-sign-v131-20261108
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned release APK
        run: gradle --no-daemon -p naver-probe :app:assembleRelease
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: NaverMap-HUD-Probe-v1.3.1-unsigned
          path: naver-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Collect apksigner
        shell: bash
        run: |
          set -eu
          JAR=$(find "${ANDROID_HOME}/build-tools" -path '*/lib/apksigner.jar' -type f | sort -V | tail -1)
          test -n "$JAR"
          mkdir -p artifacts
          cp "$JAR" artifacts/apksigner.jar
          ls -lh artifacts/apksigner.jar
      - name: Upload apksigner
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Signer-Tool
          path: artifacts/apksigner.jar
          if-no-files-found: error

      - name: Upload complete build source project (no private signing keys)
        uses: actions/upload-artifact@v4
        with:
          name: NaverMap-HUD-Probe-v1.3.1-Source-Build
          path: |
            naver-probe/**
            .github/workflows/build-naver-hud-unsigned.yml
          if-no-files-found: error
