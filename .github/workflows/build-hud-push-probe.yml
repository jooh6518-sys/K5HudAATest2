name: Build K5 Android Auto Method Trace Probe
on:
  push:
    branches:
      - k5-aa-method-trace-v14-20261108
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build unsigned APK for Android 4.4
        run: gradle --no-daemon -p hud-push-probe :app:assembleRelease
      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: K5-AA-Method-Trace-Probe-v1.4-unsigned
          path: hud-push-probe/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Upload build source
        uses: actions/upload-artifact@v4
        with:
          name: K5-AA-Method-Trace-Probe-v1.4-source
          path: |
            hud-push-probe/app/src/**
            hud-push-probe/app/build.gradle
            hud-push-probe/build.gradle
            hud-push-probe/settings.gradle
            hud-push-probe/gradle.properties
            hud-push-probe/README.md
            hud-push-probe/packaging/**
            .github/workflows/build-hud-push-probe.yml
          if-no-files-found: error
