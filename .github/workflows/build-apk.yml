name: Build Joott v1.16 unsigned APK
on:
  push:
    branches: [joott-v1-16-history-cursor-focus]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download exact v1.15 source
        uses: actions/download-artifact@v4
        with:
          name: Joott-v1-15-unsigned-and-source
          run-id: 44770738559
          github-token: ${{ github.token }}
          path: previous
      - name: Apply verified v1.16 history and cursor modifications
        run: |
          tar -xzf previous/Joott_v1_15_source.tgz
          cat joott_v116.part{0,1,2,3} | base64 -d | xz -d > joott_v116.patch
          echo 'd8bb09888dbc37518a08fdf9f1a2a488a26aa243e7937b0031f248c1ab048dcd  joott_v116.patch' | sha256sum -c -
          patch --batch --forward -p1 -d MyWebViewer_v1 < joott_v116.patch
          cat joott_v116_wake.part{0,1,2} | base64 -d | xz -d > joott_v116_wake.patch
          echo 'eae4b95fa8e56819329a63aec34eddfbc5b4f4b98d0d1b3f623ecf5817bdcbd7  joott_v116_wake.patch' | sha256sum -c -
          patch --batch --forward -p1 -d MyWebViewer_v1 < joott_v116_wake.patch
          grep -q 'versionCode = 17' MyWebViewer_v1/app/build.gradle.kts
          grep -q 'versionName = "1.16"' MyWebViewer_v1/app/build.gradle.kts
          grep -q 'showSeekCursorPreview' MyWebViewer_v1/app/src/main/java/com/jooh/mywebviewer/MainActivity.java
          grep -q 'mwvTvRefreshRing' MyWebViewer_v1/app/src/main/assets/tv-remote.js
          test -s MyWebViewer_v1/app/src/main/assets/watch-history.js
          rm -rf MyWebViewer_v1/app/build MyWebViewer_v1/.gradle
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile release APK
        working-directory: MyWebViewer_v1
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Package exact source and Android signing tools
        run: |
          test -s MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
          tar -czf Joott_v1_16_source.tgz --exclude=build --exclude=.gradle MyWebViewer_v1
          sha256sum MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p signature-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signature-tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signature-tools/zipalign
      - uses: actions/upload-artifact@v4
        with:
          name: Joott-v1-16-unsigned-and-source
          if-no-files-found: error
          path: |
            MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
            Joott_v1_16_source.tgz
            signature-tools/apksigner.jar
            signature-tools/zipalign
