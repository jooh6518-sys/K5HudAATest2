name: Build Joott v1.13 unsigned APK
on:
  push:
    branches: [joott-v1-13-landscape-external]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Retrieve exact Joott v1.12 source
        uses: actions/download-artifact@v4
        with:
          name: Joott-v1-12-unsigned-and-source
          run-id: 44754320538
          github-token: ${{ github.token }}
          path: previous
      - name: Verify and apply v1.13 source modifications
        run: |
          tar -xzf previous/Joott_v1_12_source.tgz
          cat joott_v113.part{0,1,2,3,4} | base64 -d | xz -d > joott_v113.patch
          echo '8d499500dceeb0ca31be9d522a896cfc44f176adfcf5cb25f863f37dbf7286b5  joott_v113.patch' | sha256sum -c -
          patch --batch --forward -d MyWebViewer_v1 -p1 < joott_v113.patch
          grep -q 'versionCode = 14' MyWebViewer_v1/app/build.gradle.kts
          grep -q 'versionName = "1.13"' MyWebViewer_v1/app/build.gradle.kts
          grep -q 'lastManifestMediaUrl' MyWebViewer_v1/app/src/main/java/com/jooh/mywebviewer/MainActivity.java
          rm -rf MyWebViewer_v1/app/build MyWebViewer_v1/.gradle
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile unsigned release
        working-directory: MyWebViewer_v1
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Package exact compiled source
        run: |
          test -s MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
          tar -czf Joott_v1_13_source.tgz --exclude=build --exclude=.gradle MyWebViewer_v1
          sha256sum MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Joott-v1-13-unsigned-and-source
          if-no-files-found: error
          path: |
            MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
            Joott_v1_13_source.tgz
