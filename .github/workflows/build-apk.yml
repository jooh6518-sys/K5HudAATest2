name: Build MyWebViewer APK
on:
  push:
    branches: [mywebviewer-v1-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android 35 build packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unpack exact v1 source archive
        run: tar -xzf MyWebViewer_v1_source.tgz
      - name: Build APK
        working-directory: MyWebViewer_v1
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Display APK SHA256
        run: sha256sum MyWebViewer_v1/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK and exact source archive
        uses: actions/upload-artifact@v4
        with:
          name: MyWebViewer-v1-installable
          if-no-files-found: error
          path: |
            MyWebViewer_v1/app/build/outputs/apk/debug/app-debug.apk
            MyWebViewer_v1_source.tgz
