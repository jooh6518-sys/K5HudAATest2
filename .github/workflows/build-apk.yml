name: Build Joott 1.7 unsigned APK
on:
  push:
    branches: [joott-v1-7-layout-focus]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Retrieve v1.6 full source
        uses: actions/download-artifact@v4
        with:
          name: Joott-v1-6-unsigned-and-source
          run-id: 44700704724
          github-token: ${{ github.token }}
          path: previous
      - name: Apply v1.7 source patch
        run: |
          tar -xzf previous/Joott_v1_6_source.tgz
          base64 -d joott_v17.patch.gz.b64 | gzip -d > joott_v17.patch
          patch --batch --forward -d MyWebViewer_v1 -p1 < joott_v17.patch
          grep -q 'versionCode = 8' MyWebViewer_v1/app/build.gradle.kts
          grep -q 'joott-poster-grid' MyWebViewer_v1/app/src/main/assets/site-layout.css
          rm -rf MyWebViewer_v1/app/build MyWebViewer_v1/.gradle
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile release
        working-directory: MyWebViewer_v1
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Package source and unsigned APK
        run: |
          test -s MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
          tar -czf Joott_v1_7_source.tgz --exclude=build --exclude=.gradle MyWebViewer_v1
          sha256sum MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Joott-v1-7-unsigned-and-source
          if-no-files-found: error
          path: |
            MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
            Joott_v1_7_source.tgz
