name: Build Joott v1.12 unsigned APK
on:
  push:
    branches: [joott-v1-12-player-navigation]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Retrieve verified v1.11 source
        uses: actions/download-artifact@v4
        with:
          name: Joott-v1-11-unsigned-and-source
          run-id: 44750236420
          github-token: ${{ github.token }}
          path: previous
      - name: Restore v1.12 patch and source
        run: |
          tar -xzf previous/Joott_v1_11_source.tgz
          cat joott112.patch.part{0,1,2,3,4} | base64 -d | xz -d > joott112.diff
          patch --batch --forward -d MyWebViewer_v1 -p1 < joott112.diff
          grep -q 'versionCode = 13' MyWebViewer_v1/app/build.gradle.kts
          grep -q 'versionName = "1.12"' MyWebViewer_v1/app/build.gradle.kts
          rm -rf MyWebViewer_v1/app/build MyWebViewer_v1/.gradle
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile unsigned release APK
        working-directory: MyWebViewer_v1
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Package complete source
        run: |
          test -s MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
          tar -czf Joott_v1_12_source.tgz --exclude=build --exclude=.gradle MyWebViewer_v1
          sha256sum MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Joott-v1-12-unsigned-and-source
          if-no-files-found: error
          path: |
            MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
            Joott_v1_12_source.tgz
