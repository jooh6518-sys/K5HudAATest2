name: Build Joott 1.6 unsigned APK
on:
  push:
    branches: [joott-v1-6-improvements]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch verified Joott v1.5 project
        uses: actions/download-artifact@v4
        with:
          name: Joott-v1-5-unsigned-and-source
          run-id: 44697559895
          github-token: ${{ github.token }}
          path: previous
      - name: Apply Joott 1.6 patch
        run: |
          find previous -maxdepth 2 -type f
          tar -xzf previous/Joott_v1_5_source.tgz
          base64 -d joott_v16_patch.py.gz.b64 | gzip -d > joott_v16_patch.py
          python3 joott_v16_patch.py MyWebViewer_v1
          test -f MyWebViewer_v1/app/src/main/assets/site-layout.js
          grep -q 'versionCode = 7' MyWebViewer_v1/app/build.gradle.kts
          grep -q 'versionName = "1.6"' MyWebViewer_v1/app/build.gradle.kts
          rm -rf MyWebViewer_v1/app/build MyWebViewer_v1/.gradle
      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build unsigned release
        working-directory: MyWebViewer_v1
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Package exact source
        run: |
          test -s MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
          tar -czf Joott_v1_6_source.tgz --exclude=build --exclude=.gradle MyWebViewer_v1
          sha256sum MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Joott-v1-6-unsigned-and-source
          if-no-files-found: error
          path: |
            MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
            Joott_v1_6_source.tgz
