name: Build Android Packages

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build phone test
        run: gradle --no-daemon :app:assembleDebug :app:bundleDebug

      - name: Build AI3 Binder probe
        run: gradle --no-daemon :ai3:assembleDebug

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: K5HudAATest-v0.6-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload phone AAB
        uses: actions/upload-artifact@v4
        with:
          name: K5HudAATest-v0.6-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

      - name: Upload AI3 APK
        uses: actions/upload-artifact@v4
        with:
          name: AI3HudBinderProbe-v0.2-debug-apk
          path: ai3/build/outputs/apk/debug/ai3-debug.apk
          if-no-files-found: error
