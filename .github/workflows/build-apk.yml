name: AI3 HUD Probe Build
on:
  push:
    branches: [ "chatgpt-ai3-build" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon :ai3:assembleDebug
      - run: cp ai3/build/outputs/apk/debug/ai3-debug.apk ai3_1.00.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ai3_1.00
          path: ai3_1.00.apk
          if-no-files-found: error
