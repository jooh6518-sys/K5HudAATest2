name: Build Joott v1.15 unsigned APK
on:
  push:
    branches: [joott-v1-15-autohide-seek]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore exact Joott v1.14 source
        uses: actions/download-artifact@v4
        with:
          name: Joott-v1-14-unsigned-and-source
          run-id: 44764893230
          github-token: ${{ github.token }}
          path: previous
      - name: Apply verified v1.15 patch
        run: |
          tar -xzf previous/Joott_v1_14_source.tgz
          cat joott_v115.part{0,1,2,3,4} | base64 -d | xz -d > joott_v115.patch
          echo 'c911753c1a9ea3bfcb8912623d67079cf93c212233bd63ece9e63213395a124e  joott_v115.patch' | sha256sum -c -
          patch --batch --forward -p1 -d MyWebViewer_v1 < joott_v115.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('MyWebViewer_v1/app/src/main/java/com/jooh/mywebviewer/MainActivity.java')
          s=p.read_text()
          before='private final Runnable hideInactivePlayerControls = () -> {'
          assert s.count(before)==1
          s=s.replace(before,'private final Runnable hideInactivePlayerControls = () -> hidePlayerControlsNow();\n    private void hidePlayerControlsNow() {',1)
          tail='            showFullscreenControls(false);\n    };\n    private void reschedulePlayerControlsHide()'
          assert s.count(tail)==1
          s=s.replace(tail,'            showFullscreenControls(false);\n    }\n    private void reschedulePlayerControlsHide()',1)
          p.write_text(s)
          PY
          grep -q 'versionCode = 16' MyWebViewer_v1/app/build.gradle.kts
          grep -q 'versionName = "1.15"' MyWebViewer_v1/app/build.gradle.kts
          grep -q 'seekVideoFromRemote' MyWebViewer_v1/app/src/main/java/com/jooh/mywebviewer/MainActivity.java
          rm -rf MyWebViewer_v1/app/build MyWebViewer_v1/.gradle
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile unsigned Android release
        working-directory: MyWebViewer_v1
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Archive exact compiled source
        run: |
          test -s MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
          tar -czf Joott_v1_15_source.tgz --exclude=build --exclude=.gradle MyWebViewer_v1
          sha256sum MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Joott-v1-15-unsigned-and-source
          if-no-files-found: error
          path: |
            MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
            Joott_v1_15_source.tgz
