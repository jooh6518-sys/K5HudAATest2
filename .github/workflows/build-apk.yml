name: Build MyWebViewer 1.3 TV DeX
on:
  push:
    branches: [mywebviewer-v1-3-tv-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Reconstruct 1.2 and apply the 1.3 patch
        run: |
          tar -xzf MyWebViewer_v1_source.tgz
          cp overlay-assets/* MyWebViewer_v1/app/src/main/assets/
          python3 v1_1_patch.py
          tar -xJf MyWebViewer_v1_2_tv_overlay.tar.xz -C MyWebViewer_v1
          tar -xJf MyWebViewer_v1_3_overlay.tar.xz
          patch -d MyWebViewer_v1 -p0 --batch < mwv13_MainActivity.patch
          cat mwv13_css_append.txt >> MyWebViewer_v1/app/src/main/assets/site-layout.css
          cp mwv13_tv_remote.txt MyWebViewer_v1/app/src/main/assets/tv-remote.js
          sed -i 's/versionCode = 3/versionCode = 4/; s/versionName = "1.2"/versionName = "1.3"/' MyWebViewer_v1/app/build.gradle.kts
          grep -q 'versionCode = 4' MyWebViewer_v1/app/build.gradle.kts
          grep -q 'dispatchKeyEvent' MyWebViewer_v1/app/src/main/java/com/jooh/mywebviewer/MainActivity.java
      - name: Compile release APK without private signing key
        working-directory: MyWebViewer_v1
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Pack exact source and builder
        run: |
          test -s MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
          tar -czf MyWebViewer_v1_3_TV_DeX_source.tgz MyWebViewer_v1
          sha256sum MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyWebViewer-v1-3-TV-unsigned
          if-no-files-found: error
          path: |
            MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
            MyWebViewer_v1_3_TV_DeX_source.tgz
