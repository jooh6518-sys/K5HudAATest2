name: Build Joott v1.17 episode history release
on:
  push:
    branches: [joott-v1-17-episode-history]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore v1.16 exact source
        uses: actions/download-artifact@v4
        with:
          name: Joott-v1-16-unsigned-and-source
          run-id: 44847157912
          github-token: ${{ github.token }}
          path: previous
      - name: Apply verified v1.17 episode history patch
        run: |
          tar -xzf previous/Joott_v1_16_source.tgz
          base64 -d joott_v117.patch.xz.b64 | xz -d > joott_v117.patch
          echo '8e9d5c0500138b54c136a091fe546547e02c765d28680e47515db8aa952f58fd  joott_v117.patch' | sha256sum -c -
          patch --batch --forward -p1 -d MyWebViewer_v1 < joott_v117.patch
          grep -q 'versionCode = 18' MyWebViewer_v1/app/build.gradle.kts
          grep -q 'versionName = "1.17"' MyWebViewer_v1/app/build.gradle.kts
          test -s MyWebViewer_v1/app/src/main/assets/episode-capture.js
          grep -q 'showCombinedWatchHistory' MyWebViewer_v1/app/src/main/java/com/jooh/mywebviewer/MainActivity.java
          rm -rf MyWebViewer_v1/app/build MyWebViewer_v1/.gradle
      - name: Android SDK dependencies
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile release APK
        working-directory: MyWebViewer_v1
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Package exact source
        run: |
          test -s MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
          tar -czf Joott_v1_17_source.tgz --exclude=build --exclude=.gradle MyWebViewer_v1
          sha256sum MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Joott-v1-17-unsigned-and-source
          if-no-files-found: error
          path: |
            MyWebViewer_v1/app/build/outputs/apk/release/app-release-unsigned.apk
            Joott_v1_17_source.tgz
