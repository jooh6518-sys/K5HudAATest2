name: Build Naver Notification Probe APK
on:
  push:
    branches:
      - naver-notification-probe-20261108
      - naver-notification-probe-v11-20261108
      - naver-overlay-accessibility-v12-20261108
      - naver-overlay-status-fix-v121-20261108
      - naver-overlay-polling-v13-20261108
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon -p naver-probe :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NaverNotificationProbe-v1.3-overlay-debug-apk
          path: naver-probe/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
